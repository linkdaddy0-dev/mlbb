name: MLDraft Static Data Weekly Sync

on:
  schedule:
    # Trigger daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub actions dashboard

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the updated JSON files back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Crawler Scraper
      run: python scraper.py

    - name: Generate Missing Heroes Data (IDs 125-132)
      run: python scripts/generate_missing_heroes.py

    - name: Run Official GMS Matchups Scraper
      run: python scripts/scrape_official_matchups.py

    - name: Run Official GMS Relations Scraper
      run: python scripts/scrape_official_relations.py

    - name: Compile Optimized Static JSON
      run: python compile_data.py

    - name: Validate Compiled Outputs
      run: python validate_data.py

    - name: Commit and Push static data assets
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add public/data/patches/ public/data/meta/ src/data/ data/official_matchups.json data/official_relations.json
        git diff-index --quiet HEAD || (git commit -m "chore: auto-sync localized hero datasets [skip ci]" && git push)
