name: MLDraft Static Data Weekly Sync

on:
  schedule:
    # Trigger daily at 19:00 UTC (after Moonton's data updates)
    - cron: '0 19 * * *'
    # Retry slot. Re-running is cheap now that an unchanged payload no longer
    # bumps the data revision, and it covers the 19:00 run being blocked upstream.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub actions dashboard

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the updated JSON files back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Mark run start
      # Every critical scrape output must be rewritten after this marker,
      # otherwise verify_sync.py fails the run instead of publishing stale data.
      run: touch .run_marker

    - name: Run Crawler Scraper
      run: python scraper.py

    - name: Generate Missing Heroes Data (IDs 125-132)
      run: python scripts/generate_missing_heroes.py

    - name: Run Official GMS Matchups Scraper
      run: python scripts/scrape_official_matchups.py

    - name: Run Official GMS Relations Scraper
      run: python scripts/scrape_official_relations.py

    - name: Verify scrape outputs are fresh
      run: python scripts/verify_sync.py .run_marker

    - name: Compile Optimized Static JSON
      run: python compile_data.py

    - name: Validate Compiled Outputs
      run: python validate_data.py

    - name: Commit and Push static data assets
      run: |
        rm -f .run_marker
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        # public/assets/{skills,banners,heroes}/ carry artwork the scraper mirrors
        # from the current GMS API for heroes the legacy API cannot serve. These
        # are what let a brand-new hero appear in the app with no release: the
        # client falls back to the OTA worker for any asset missing from the APK,
        # and the worker serves them from this repo.
        git add public/data/patches/ public/data/meta/ \
                public/assets/skills/ public/assets/banners/ public/assets/heroes/ \
                src/data/ data/official_matchups.json data/official_relations.json
        # Check what is STAGED, not the whole tree. git diff-index compares the
        # working tree too, so an untracked-by-design file like
        # data/official_matchups_raw.json being modified would send us into the
        # commit branch with nothing staged, and `git commit` fails the run.
        # That only started biting once compile_data stopped bumping the
        # revision on every run, since current_patch.json used to always differ.
        git diff --cached --quiet || (git commit -m "chore: auto-sync localized hero datasets [skip ci]" && git pull --rebase --autostash origin main && git push)
